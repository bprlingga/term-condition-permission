<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peraturan Perusahaan - Pasal 41</title>

    <!-- Font Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            color: #1f2937;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }

        h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: 600;
            color: #4b5563;
        }

        .section p {
            margin-bottom: 15px;
            text-align: center;
            font-size: 15px;
        }

        ol {
            padding-left: 20px;
        }

        ol li {
            margin-bottom: 10px;
            font-size: 15px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
            color: #6b7280;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h2 {
                font-size: 20px;
            }

            h3 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>TAHAP PENGEMBANGAN</h2>

        <div class="section">
            <p>
                Informasi tentang izin dapat kontak langsung ke Divisi Sumber Daya Manusia
            </p>
        </div>
    </div>

</body>
</html>
